    -webkit-touch-callout:none;
  }
  img{-webkit-user-drag:none;user-drag:none;pointer-events:none}

  html,body{background:#fff;height:100%;overflow:hidden}

  body{
    font-family:'Poppins','Noto Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    color:var(--blue);
    display:flex;
    align-items:center;
    justify-content:center;
  }

  /* --w = 사진 한 칸의 너비. 이 값 하나로 전체 크기가 정해짐 */
  .stage{
    --w:min(255px, 30vw, 44vh);
    --gap:calc(var(--w) * .34);
    --panel:calc(var(--w) * 1.5);
    --hair:max(1px, calc(var(--w) * .005));
    display:flex;
    align-items:flex-start;
  }

  /* ── 왼쪽 : 사진 ── */
  .left{width:var(--w);flex:none}

  /* ── 토글 스위치 : 파란 알약 + 흰 물방울 손잡이 ── */
  .toggle{
    position:relative;
    width:calc(var(--w) * .20);
    height:calc(var(--w) * .086);
    margin-bottom:calc(var(--w) * .09);
    border:0;
    border-radius:999px;
    background:linear-gradient(155deg, #EAF5F9 0%, #C9E1EC 100%);
    box-shadow:
      0 calc(var(--w) * .005) calc(var(--w) * .016) rgba(58,147,194,.16),
      inset 0 calc(var(--w) * .004) calc(var(--w) * .009) rgba(31,102,144,.14);
    opacity:.55;
    cursor:default;
    pointer-events:none;
    transition:background .55s ease, box-shadow .55s ease, opacity .55s ease;
  }
  .stage.open .toggle{opacity:1;cursor:pointer;pointer-events:auto}
  .toggle:focus-visible{outline:1px solid var(--blue);outline-offset:calc(var(--w) * .025)}

  .toggle.on{
    background:linear-gradient(155deg, #6FCBE4 0%, #3A93C2 48%, #1F6690 100%);
    box-shadow:
      0 calc(var(--w) * .007) calc(var(--w) * .022) rgba(58,147,194,.28),
      inset 0 calc(var(--w) * .005) calc(var(--w) * .010) rgba(255,255,255,.30);
  }

  /* 켜졌을 때 알약 뒤로 은은하게 번지는 빛 */
  .toggle::before{
    content:"";
    position:absolute;
    inset:calc(var(--w) * -.045);
    border-radius:999px;
    background:radial-gradient(closest-side, rgba(58,147,194,.40), transparent 74%);
    filter:blur(calc(var(--w) * .016));
    opacity:0;
    transition:opacity .6s ease;
    pointer-events:none;
    z-index:-1;
  }
  .toggle.on::before{opacity:1;animation:breathe 3.4s ease-in-out infinite alternate}
  @keyframes breathe{from{opacity:.5}to{opacity:1}}

  /* 손잡이 : 트랙보다 크게 솟은 흰 원 */
  .knob{
    position:absolute;
    top:50%;
    left:calc(var(--w) * .013);
    width:calc(var(--w) * .060);
    height:calc(var(--w) * .060);
    border-radius:50%;
    background:radial-gradient(125% 125% at 34% 26%,
      #ffffff 0%, #F2FAFC 58%, #D6E8F0 100%);
    box-shadow:
      inset 0 calc(var(--w) * -.003) calc(var(--w) * .005) rgba(31,102,144,.16),
      inset 0 calc(var(--w) * .002) calc(var(--w) * .003) rgba(255,255,255,.95),
      0 calc(var(--w) * .004) calc(var(--w) * .009) rgba(31,102,144,.30);
    transform:translate(0,-50%);
    transition:transform .6s cubic-bezier(.3,1.25,.4,1), box-shadow .6s ease;
  }
  .toggle.on .knob{
    transform:translate(calc(var(--w) * .114),-50%);
    box-shadow:
      inset 0 calc(var(--w) * -.003) calc(var(--w) * .005) rgba(31,102,144,.20),
      inset 0 calc(var(--w) * .002) calc(var(--w) * .003) rgba(255,255,255,.95),
      0 calc(var(--w) * .004) calc(var(--w) * .010) rgba(31,102,144,.35);
  }

  .art{position:relative;padding-top:calc(var(--w) * .07)}
  .frame{
    position:absolute;
    top:0;
    bottom:calc(var(--w) * .07);
    left:9%;
    right:-9%;
    border:var(--hair) solid var(--blue);
    pointer-events:none;
    transition:border-color .8s ease;
  }

  .photo{
    position:relative;
    width:100%;
    aspect-ratio:1 / .99;
    background:#D7ECF3;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow:calc(var(--w) * .022) calc(var(--w) * .022) calc(var(--w) * .07) rgba(58,147,194,.16);
    transition:box-shadow .5s ease;
  }
  .photo:focus-visible{outline:var(--hair) solid var(--blue);outline-offset:calc(var(--w) * .02)}
  .stage.open .photo{box-shadow:calc(var(--w) * .01) calc(var(--w) * .01) calc(var(--w) * .05) rgba(58,147,194,.13)}
  .photo img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    opacity:0;
    transition:opacity .8s ease;
  }
  .photo img.on{opacity:1}
  .photo img{z-index:1}
  .photo-hint{
    position:relative;
    z-index:0;
    transition:opacity .5s ease;
    pointer-events:none;
    font-size:calc(var(--w) * .036);
    letter-spacing:.16em;
    line-height:2;
    text-align:center;
    color:#7FAEC4;
  }

  /* ── 컬러칩 : 사진 오른쪽 아래에 작게 / 누르면 상호작용 ── */
  .swatches{
    width:46%;
    margin:calc(var(--w) * .028) 0 0 auto;
    display:flex;
    gap:calc(var(--w) * .012);
  }
  .swatches i{
    flex:1 1 0;
    min-width:0;
    aspect-ratio:1;
    display:block;
    cursor:default;
    pointer-events:none;
    transition:transform .45s cubic-bezier(.16,1,.3,1), box-shadow .45s ease;
  }
  .stage.open .swatches i{cursor:pointer;pointer-events:auto}
  .stage.open .swatches i:hover{transform:translateY(-14%)}
  .swatches i.on{
    transform:translateY(-22%);
    box-shadow:0 calc(var(--w) * .02) calc(var(--w) * .05) rgba(58,147,194,.30);
  }
  .swatches i:focus-visible{outline:1px solid var(--blue);outline-offset:3px}
  .swatches i:nth-child(1){background:var(--sw1)}
  .swatches i:nth-child(2){background:var(--sw2)}
  .swatches i:nth-child(3){background:var(--sw3)}
  .swatches i:nth-child(4){background:var(--sw4)}
  .swatches i:nth-child(5){background:var(--sw5)}

  /* ── 오른쪽 : 펼쳐지는 패널 ── */
  .panel{
    width:0;
    margin-left:0;
    opacity:0;
    overflow:hidden;
    transition:
      width .75s cubic-bezier(.16,1,.3,1),
      margin-left .75s cubic-bezier(.16,1,.3,1),
      opacity .5s ease;
  }
  .stage.open .panel{width:var(--panel);margin-left:var(--gap);opacity:1}

  .inner{
    width:var(--panel);
    height:calc(var(--w) * 1.42);
    display:flex;
    flex-direction:column;
    transform:translateX(calc(var(--w) * -.06));
    transition:transform .8s cubic-bezier(.16,1,.3,1);
  }
  .stage.open .inner{transform:none}

  .views{
    flex:1 1 auto;
    min-height:0;
    padding-bottom:calc(var(--w) * .03);
    overflow-y:auto;
    overscroll-behavior:contain;
    scrollbar-width:thin;
    scrollbar-color:rgba(58,147,194,.35) transparent;
    display:flex;
    flex-direction:column;
    mask-image:linear-gradient(#000 calc(100% - 1.6em), transparent);
    -webkit-mask-image:linear-gradient(#000 calc(100% - 1.6em), transparent);
  }
  .views::-webkit-scrollbar{width:calc(var(--w) * .012)}
  .views::-webkit-scrollbar-thumb{
    background:rgba(58,147,194,.35);
    border-radius:999px;
  }
  .views::-webkit-scrollbar-track{background:transparent}
  .foot{flex:none}
  .rule{width:100%;height:var(--hair);background:var(--blue)}
  .view{display:none;flex:0 0 auto;flex-direction:column}
  .view.on{display:flex;animation:swap 1.05s cubic-bezier(.16,1,.3,1) both}
  @keyframes swap{
    from{opacity:0;transform:translateX(calc(var(--w) * -.12))}
    to{opacity:1;transform:none}
  }

  .eyebrow{
    font-size:calc(var(--w) * .042);
    font-weight:600;
    letter-spacing:.4em;
    margin-bottom:.6em;
  }
  .title{
    font-size:calc(var(--w) * .092);
    font-weight:700;
    letter-spacing:.07em;
    line-height:1.15;
  }
  .body{
    margin-top:1.5em;
    font-size:calc(var(--w) * .045);
    font-weight:600;
    line-height:1.6;
    color:var(--blue-deep);
  }

  .place{
    margin-top:auto;
    padding-top:calc(var(--w) * .08);
    text-align:right;
    transition:opacity .5s ease;
  }
  /* 컬러칩 페이지 : 장소 문구는 접고 구분선만 남긴 뒤, 본문 칸을 그 선까지 내림 */
  .stage.chip .place{display:none}
  .place .paren{
    font-size:calc(var(--w) * .04);
    font-weight:400;
    transition:opacity .5s ease;
  }
  .place .name{
    display:inline-block;
    margin-top:.2em;
    font-size:calc(var(--w) * .045);
    font-weight:700;
    color:var(--blue-deep);
    transition:color .5s ease;
  }

  /* 색 상세 화면 */
  .chip-name{
    position:sticky;
    top:0;
    z-index:2;
    padding-bottom:.5em;
    background:#fff;
    font-size:calc(var(--w) * .058);
    font-weight:700;
    letter-spacing:.26em;
    line-height:1.3;
    color:var(--blue);
  }
  .chip-name.ko{font-size:calc(var(--w) * .052);letter-spacing:.04em}

  /* 프로필 표 + 공지 문서 */
  .doc{
    margin-top:1.3em;
    font-size:calc(var(--w) * .045);
    font-weight:500;
    line-height:1.85;
    letter-spacing:-.01em;
    word-break:keep-all;
    color:var(--blue-deep);
  }
  .doc mark{
    background:linear-gradient(transparent 58%, rgba(92,200,224,.55) 58%);
    color:inherit;
    font-weight:700;
  }
  .prof{
    display:grid;
    grid-template-columns:auto 1fr;
    gap:.35em .9em;
    padding-bottom:1.1em;
    border-bottom:var(--hair) solid rgba(58,147,194,.35);
  }
  .prof .k{font-weight:600;color:var(--blue);white-space:nowrap}
  .prof .v{font-weight:600}
  .sec{
    margin:1.3em 0 .8em;
    font-size:.92em;
    font-weight:600;
    letter-spacing:.34em;
    color:var(--blue);
  }
  .lead{
    margin-bottom:1.2em;
    text-align:center;
    font-weight:700;
  }
  .doc .b{margin-top:1.25em;padding-left:1em;text-indent:-1em}
  .doc .s{margin-top:.4em;padding-left:2.3em;text-indent:-1em;opacity:.9}
  .doc .c{display:block;text-indent:0;padding-left:1.05em;margin-top:.1em}

  /* NG 항목 표 */
  .ng{display:flex;flex-wrap:wrap;gap:.45em}
  .ng + .b{margin-top:1.3em}
  .ng span{
    flex:0 0 auto;
    padding:.36em .9em;
    text-align:center;
    white-space:nowrap;
    border-radius:999px;
    background:rgba(92,200,224,.18);
    font-size:.95em;
    font-weight:600;
    color:var(--blue-deep);
  }
  .ng .wide{border-radius:999px}
  /* 안내 문장 */
  .doc .note{margin-top:.7em;font-size:.95em;line-height:1.6;opacity:.85}
  .doc .note:first-child{margin-top:0}

  /* 계정 목록 */
  .list{
    margin-top:1.3em;
    display:grid;
    grid-template-columns:minmax(0,auto) minmax(0,1fr);
    gap:.55em .9em;
  }
  .list > div{
    padding-bottom:.5em;
    border-bottom:var(--hair) solid rgba(58,147,194,.18);
  }
  .list > div:nth-last-child(-n+2){border-bottom:0;padding-bottom:0}
  .list .h{font-weight:700;color:var(--blue);overflow-wrap:anywhere}
  .list .v{font-weight:600;overflow-wrap:anywhere;line-height:1.6}

  /* 사진 카드 */
  .card{
    position:relative;
    margin-top:.6em;
    aspect-ratio:3 / 2;
    border-radius:.9em;
    overflow:hidden;
    box-shadow:0 .5em 1.2em rgba(58,147,194,.25);
  }
  .card img{width:100%;height:100%;object-fit:cover;display:block}
  .card::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(to top, rgba(12,58,84,.72) 0%, rgba(12,58,84,.18) 42%, transparent 68%);
  }
  .card .cap{
    position:absolute;
    left:1.1em;
    right:1.1em;
    bottom:.95em;
    z-index:1;
    color:#fff;
    text-shadow:0 1px 3px rgba(10,45,68,.55);
  }
  .card .cap .n{font-size:1.15em;font-weight:700;letter-spacing:.12em}
  .card .cap .l{margin-top:.35em;font-size:.95em;font-weight:600;line-height:1.5}
  .card .go{
    position:absolute;
    top:.85em;
    right:.85em;
    z-index:2;
    padding:.4em .85em;
    border-radius:999px;
    background:rgba(255,255,255,.78);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    color:var(--blue-deep);
    font-size:.9em;
    font-weight:700;
    letter-spacing:.04em;
    text-decoration:none;
    transition:background .3s ease, transform .3s ease;
  }
  .card .go:hover{background:#fff;transform:translateY(-1px)}

  /* 인용구 */
  .quote{
    margin-top:1.4em;
    padding:.1em 0 .1em 1em;
    border-left:calc(var(--hair) * 2) solid rgba(58,147,194,.45);
    font-size:.88em;
    font-weight:500;
    font-style:italic;
    line-height:1.9;
    color:var(--blue-deep);
  }

  /* 태그 */
  .tags{display:flex;flex-wrap:wrap;gap:.55em .9em;margin-top:1.5em}
  .tags span{
    padding-bottom:.12em;
    border-bottom:var(--hair) solid var(--sw3);
    font-size:.66em;
    font-weight:600;
    letter-spacing:0;
    white-space:nowrap;
    color:var(--sw3);
  }

  /* 캐릭터 프로필 */
  .roster{
    margin-top:2.6em;
    padding-bottom:.6em;
    border-bottom:var(--hair) solid rgba(58,147,194,.35);
    font-size:.9em;
    font-weight:700;
    letter-spacing:.02em;
    color:var(--blue);
  }

  .pc{
    --ink:#1F3D6E;
    margin-top:1.7em;
  }
  .pc + .pc{
    margin-top:1.6em;
    padding-top:1.6em;
    border-top:var(--hair) solid rgba(58,147,194,.28);
  }
  .pc.teal{--ink:#0E6A72}

  .pc .top{display:flex;align-items:center;gap:1.1em}
  .pc.rev .top{flex-direction:row-reverse}
  .pc.rev .head{text-align:right}
  .pc.rev .lead2,
  .pc.rev .desc{text-align:right}

  .pc .ph{flex:none;width:30%;aspect-ratio:1;overflow:hidden}
  .pc .ph img{width:100%;height:100%;object-fit:cover;display:block}
  .pc .head{flex:1;min-width:0}

  .pc .nm{
    font-size:1.15em;
    font-weight:700;
    letter-spacing:.14em;
    line-height:1.2;
    color:var(--ink);
  }
  .pc .nm span{font-size:.62em;font-weight:600;letter-spacing:.02em;opacity:.75}

  .pc .badge{
    display:inline-block;
    margin-top:.55em;
    padding:.3em .8em;
    background:var(--ink);
    color:#fff;
    font-size:.75em;
    font-weight:600;
    letter-spacing:.08em;
  }
  .pc .meta{
    margin-top:.5em;
    font-size:.8em;
    font-weight:600;
    color:var(--blue-deep);
    opacity:.9;
  }

  .pc .lead2{margin-top:1.1em;font-size:.9em;font-weight:700;color:var(--ink)}
  .pc .desc{margin-top:.5em;font-size:.85em;line-height:1.8;opacity:.9}

  .pc .boxes{display:flex;flex-wrap:wrap;gap:.4em;margin-top:.9em}
  .pc.rev .boxes{justify-content:flex-end}
  .pc .boxes span{
    padding:.28em .7em;
    border:var(--hair) solid var(--ink);
    font-size:.75em;
    font-weight:600;
    color:var(--ink);
    white-space:nowrap;
  }

  /* 줄 사이 장식 */
  .orn{
    margin:1.4em 0 .2em;
    text-align:center;
    font-size:.8em;
    letter-spacing:.06em;
    color:var(--blue);
    opacity:.7;
  }

  /* 링크 목록 */
  .links{display:flex;flex-direction:column;gap:.45em;margin-top:1.3em}
  .links:first-child{margin-top:.3em}
  .links a{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:1em;
    padding:.75em .95em;
    border:var(--hair) solid rgba(58,147,194,.4);
    color:var(--blue-deep);
    font-size:.9em;
    font-weight:600;
    text-decoration:none;
    transition:background .3s ease, border-color .3s ease, color .3s ease;
  }
  .links a:hover{background:rgba(92,200,224,.16);border-color:var(--blue);color:var(--blue)}
  .links a i{font-style:normal;font-size:.85em;opacity:.55}

  /* 하단 바로가기 */
  .more{
    display:inline-block;
    margin-top:2.2em;
    padding-bottom:.25em;
    border-bottom:var(--hair) solid var(--blue);
    font-size:.85em;
    font-weight:600;
    letter-spacing:.06em;
    color:var(--blue);
    text-decoration:none;
    transition:color .3s ease, border-color .3s ease;
  }
  .more:hover{color:var(--blue-deep);border-color:var(--blue-deep)}

  .divide{
    margin:1.4em 0 .3em;
    height:var(--hair);
    background:rgba(58,147,194,.35);
  }

  .chip-desc{
    margin-top:1.6em;
    font-size:calc(var(--w) * .045);
    font-weight:600;
    line-height:1.6;
    color:var(--blue-deep);
  }

  /* 날짜 + 바코드 : 작게, 오른쪽 아래 꾸밈 */
  .deco{
    margin:0 0 0 auto;
    padding-top:calc(var(--w) * .045);
    width:66%;
    opacity:.45;
  }
  .date{
    display:flex;
    align-items:center;
    gap:.5em;
    font-size:calc(var(--w) * .032);
    font-weight:600;
    color:var(--blue-deep);
    line-height:1;
  }
  .date .line{flex:1;height:var(--hair);background:var(--blue)}
  .date .month{font-style:italic;color:var(--blue)}
  /* Code 128 로 인코딩한 'POINTNEMO' */
  .barcode{
    margin:calc(var(--w) * .035) 0 0 auto;
    width:calc(var(--w) * .30);
    height:calc(var(--w) * .058);
    color:var(--blue);
  }
  .barcode svg{width:100%;height:100%;display:block;shape-rendering:crispEdges}

  /* ── 좁은 화면 : 아래로 펼쳐짐 ── */
  @media (max-aspect-ratio:1/1){
    .stage{
      --w:min(235px, 68vw, 31vh);
      --gap:calc(var(--w) * .1);
      --panel:var(--w);
      flex-direction:column;
      align-items:stretch;
    }
    .panel{
      width:var(--panel);
      max-height:0;
      margin-left:0;
      transition:
        max-height 1.05s cubic-bezier(.16,1,.3,1),
        margin-top 1.05s cubic-bezier(.16,1,.3,1),
        opacity .75s ease;
    }
    .stage.open .panel{width:var(--panel);max-height:calc(var(--w) * 1.5);margin-left:0;margin-top:var(--gap)}
    .inner{
      height:auto;
      transform:translateY(calc(var(--w) * -.05));
      transition:transform 1.1s cubic-bezier(.16,1,.3,1);
    }
    .stage.open .inner{transform:none}
    .views{flex:none;height:auto;overflow:visible}
    .foot{margin-top:0}
    .place{margin-top:calc(var(--w) * .09)}
    .deco{padding-top:calc(var(--w) * .09)}
  }

  /* ── 좁은 화면용 유리 팝업 ── */
  .pop{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px;
    background:rgba(219,240,247,.38);
    backdrop-filter:blur(3px);
    -webkit-backdrop-filter:blur(3px);
    opacity:0;
    pointer-events:none;
    transition:opacity .6s ease;
    z-index:10;
  }
  .pop.on{opacity:1;pointer-events:auto}

  .pop-card{
    position:relative;
    width:min(360px,90vw);
    overflow:hidden;
    text-align:left;
    border-radius:26px;
    background:rgba(255,255,255,.72);
    backdrop-filter:blur(26px) saturate(180%);
    -webkit-backdrop-filter:blur(26px) saturate(180%);
    border:1px solid rgba(255,255,255,.85);
    box-shadow:0 24px 60px rgba(58,147,194,.22);
    transform:scale(.86) translateY(14px);
    opacity:0;
    transition:transform .85s cubic-bezier(.2,1.2,.35,1), opacity .6s ease;
  }
  .pop.on .pop-card{transform:none;opacity:1}

  /* 상단바 */
  .pop-bar{
    display:flex;
    align-items:center;
    gap:11px;
    padding:15px 17px;
    background:rgba(255,255,255,.45);
    border-bottom:1px solid rgba(58,147,194,.20);
  }
  .pop-dot{
    width:13px;
    height:13px;
    flex:none;
    transform:translateY(-.5px);
    border-radius:50%;
    box-shadow:
      inset 0 -2px 3px rgba(31,102,144,.25),
      inset 0 1px 2px rgba(255,255,255,.85);
  }
  .pop-title{
    font-size:11.5px;
    font-weight:600;
    line-height:1;
    letter-spacing:.24em;
    color:var(--blue);
  }

  /* 내용 */
  .pop-body{padding:22px 20px 20px;max-height:70vh;overflow-y:auto;overscroll-behavior:contain}
  .pop-body .doc{margin-top:0;font-size:12.5px;line-height:1.8}
  .pop-body .prof{gap:.3em .8em}
  .pop-title.ko{letter-spacing:.06em}
  .pop-desc{
    margin-top:2px;
    font-size:13px;
    font-weight:600;
    line-height:1.6;
    color:var(--blue-deep);
  }

  @media (prefers-reduced-motion:reduce){
    .panel,.inner,.toggle,.knob,.swatches i,.photo,.pop,.pop-card{transition-duration:.01ms}
    .view.on{animation-duration:.01ms}
    .toggle.on::before{animation:none}
  }
</style>
</head>

  ];

  const stage    = document.getElementById('stage');
  const toggle   = document.getElementById('toggle');
  const photo    = document.getElementById('photo');
  const chips    = [...document.querySelectorAll('#swatches i')];
  const viewMain = document.getElementById('viewMain');
  const viewChip = document.getElementById('viewChip');
  const pop      = document.getElementById('pop');
  const popBody  = document.getElementById('popBody');

  function closePop(){
    pop.classList.remove('on');
    setTimeout(() => {
      if (!pop.classList.contains('on')) popBody.innerHTML = '';   // 다음 열림은 항상 맨 위부터
    }, 650);
  }

  const frame     = document.querySelector('.frame');
  const photoImg  = document.getElementById('photoImg');
  const photoHint = document.getElementById('photoHint');

  const narrow = () => window.matchMedia('(max-aspect-ratio:1/1)').matches;
  let lastChip = 0;

  /* 사진 교체 : 잠깐 흐려졌다가 새 사진으로 */
  function setPhoto(src){
    if (!src){
      photoImg.classList.remove('on');
      photoHint.style.opacity = 1;
      return;
    }
    if (photoImg.getAttribute('src') === src){ photoImg.classList.add('on'); return; }
    photoImg.classList.remove('on');
    photoHint.style.opacity = 0;
    setTimeout(() => {
      photoImg.src = src;
      photoImg.decode ? photoImg.decode().then(() => photoImg.classList.add('on')).catch(() => photoImg.classList.add('on'))
                      : photoImg.classList.add('on');
    }, 260);
  }

  setPhoto(MAIN_IMG);

  /* 스위치 위치 : 왼쪽 = 기본 문구 / 오른쪽 = 컬러칩 */
  function setSwitch(on){
    toggle.classList.toggle('on', on);
    toggle.setAttribute('aria-checked', String(on));
  }

  function showView(el){
    if (el.classList.contains('on')) return;   // 같은 화면이면 다시 불러오지 않음
    [viewMain, viewChip].forEach(v => v.classList.remove('on'));
    void el.offsetWidth;            // 애니메이션 재시작
    el.classList.add('on');
  }

  function setOpen(on){
    stage.classList.toggle('open', on);
    photo.setAttribute('aria-expanded', on);

    /* 닫혀 있을 때는 스위치·컬러칩이 키보드로도 잡히지 않게 */
    toggle.disabled = !on;
    toggle.tabIndex = on ? 0 : -1;
    chips.forEach(c => {
      c.tabIndex = on ? 0 : -1;
      c.setAttribute('aria-disabled', String(!on));
      if (!on) c.classList.remove('on');
    });

    if (!on){
      stage.classList.remove('chip');
      frame.style.borderColor = '';
      setPhoto(MAIN_IMG);
      closePop();
      showView(viewMain);
      setSwitch(false);
    }
  }

  /* 기본 문구 페이지로 */
  function toMain(){
    stage.classList.remove('chip');
    frame.style.borderColor = '';
    setPhoto(MAIN_IMG);
    chips.forEach(c => c.classList.remove('on'));
    closePop();
    showView(viewMain);
    setSwitch(false);
  }

  /* 컬러칩 페이지로 (좁은 화면은 유리 팝업) */
  function toChip(i){
    const c = COLORS[i];
    lastChip = i;
    chips.forEach((el, n) => el.classList.toggle('on', n === i));
    setSwitch(true);
    stage.classList.toggle('chip', !narrow());
    frame.style.borderColor = c.hex;
    setPhoto(c.img);

    if (narrow()){
      const popTitle = document.getElementById('popTitle');
      document.getElementById('popDot').style.background = c.hex;
      popTitle.textContent = c.name;
      popTitle.classList.toggle('ko', !!c.html);
      popBody.innerHTML = '';
      popBody.scrollTop = 0;
      popBody.innerHTML = c.html || '<p class="pop-desc">' + c.desc + '</p>';
      pop.classList.add('on');
      requestAnimationFrame(() => { popBody.scrollTop = 0; });
    } else {
      const chipName = document.getElementById('chipName');
      chipName.textContent = c.name;
      chipName.classList.toggle('ko', !!c.html);
      document.getElementById('chipBody').innerHTML =
        c.html || '<p class="chip-desc">' + c.desc + '</p>';
      viewChip.scrollTop = 0;
      document.querySelector('.views').scrollTop = 0;
      showView(viewChip);
    }
  }

  /* 1단계 : 첫 화면에서는 사진만 눌린다 */
  function togglePhoto(){
    if (stage.classList.contains('open')) {
      setOpen(false);
    } else {
      showView(viewMain);
      setOpen(true);
    }
  }
  photo.addEventListener('click', togglePhoto);
  photo.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); togglePhoto(); }
  });

  /* 2단계 : 스위치 — 오른쪽이면 기본 문구로, 왼쪽이면 마지막 색 페이지로 */
  toggle.addEventListener('click', () => {
    if (!stage.classList.contains('open')) return;
    toggle.classList.contains('on') ? toMain() : toChip(lastChip);
  });

  /* 2단계 : 컬러칩 */
  chips.forEach((el, i) => {
    el.addEventListener('click', () => {
      if (!stage.classList.contains('open')) return;
      toChip(i);
    });
    el.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' '){
        if (!stage.classList.contains('open')) return;
        e.preventDefault(); toChip(i);
      }
    });
  });

  /* 팝업을 누르면 닫히고 스위치도 함께 꺼짐 */
  pop.addEventListener('click', toMain);
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && stage.classList.contains('open')) toMain();
  });

  setOpen(false);   // 첫 화면 상태로 시작
</script>


<script>
  /* 우클릭 · 드래그 · 복사 · 개발자도구 단축키 차단 */
  (function(){
    const block = e => { e.preventDefault(); return false; };
    document.addEventListener('contextmenu', block);
    document.addEventListener('dragstart', block);
    document.addEventListener('selectstart', e => {
      if (!e.target.closest('input, textarea')) block(e);
    });
    document.addEventListener('copy', block);
    document.addEventListener('cut', block);
    document.addEventListener('keydown', e => {
      const k = e.key.toLowerCase();
      if (e.key === 'F12') return block(e);
      if (e.ctrlKey && e.shiftKey && ['i','j','c','k'].includes(k)) return block(e);
      if (e.metaKey && e.altKey && ['i','j','c','u'].includes(k)) return block(e);
      if ((e.ctrlKey || e.metaKey) && ['u','s','p','a','c','x'].includes(k)) return block(e);
    });
  })();
</script>
